<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
  {% block head %}{% endblock %}
  <title>{% block title %}Incident Triage{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #656d76; --line: #d8dee4;
      --link: #0969da; --code-bg: #f3f4f6;
      --alert: #c62828; --alert-bg: #fdecea; --warn: #9a6700; --warn-bg: #fff4d6;
      --series-1: #2a78d6; --grid: #e6e8eb;
      --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0; --line: #30363d;
        --link: #58a6ff; --code-bg: #0d1117;
        --alert: #ff7b72; --alert-bg: #3a1d1d; --warn: #e3b341; --warn-bg: #33290f;
        --series-1: #3987e5; --grid: #262c34;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .muted { color: var(--muted); }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px;
          padding: 12px; overflow-x: auto; margin: 0; white-space: pre; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
            color: inherit; display: block; }
    a.tile:hover { text-decoration: none; border-color: var(--muted); }
    .tile.active { border-color: var(--text); }
    .stopper-tile .value { color: var(--alert); }
    .tile .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .tile .value { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tile.alert .value { color: var(--alert); }
    .tile.warning .value { color: var(--warn); }

    .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }

    .stoppers { border: 2px solid var(--alert); background: var(--alert-bg); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; }
    .stoppers h2 { color: var(--alert); }
    .stopper { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-top: 8px; }
    .stopper-title { font-weight: 600; }
    .stopper-meta { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
    .stopper-action strong { color: var(--alert); }

    .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .app-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: inherit; }
    .app-card:hover { text-decoration: none; border-color: var(--muted); }
    .app-card.active { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
    .app-card.has-stopper { border-left: 4px solid var(--alert); }
    .app-name { font-weight: 600; overflow-wrap: anywhere; }
    .app-counts { color: var(--muted); font-size: 12px; }
    .stopper-pill { color: var(--alert); font-weight: 600; }

    .group-row td { background: var(--bg); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .group-row.sev1 td { color: var(--alert); }

    /* top-level view tabs: Alerts | API analysis */
    .view-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin: 0 0 20px; }
    .view-tabs a { padding: 8px 2px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
    .view-tabs a.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
    .view-tabs a:hover { text-decoration: none; color: var(--text); }

    /* health: icon + word, never color alone */
    .health { white-space: nowrap; }
    .health-icon { font-weight: 700; }
    .health-healthy .health-icon { color: var(--good); }
    .health-degraded .health-icon { color: var(--warning); }
    .health-unhealthy .health-icon { color: var(--critical); }
    .app-heading { font-size: 18px; margin: 0 0 12px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .app-heading .health { font-size: 14px; font-weight: 500; }
    .tile .hint { color: var(--muted); font-size: 12px; }
    .tile .value { font-size: 24px; }

    /* hourly bar chart: thin bars, 2px gap, rounded data end, recessive axis */
    .chart { position: relative; padding: 18px 0 0 44px; }
    .chart-ymax { position: absolute; left: 0; top: 18px; width: 40px; font-size: 11px; color: var(--muted); text-align: right; }
    .bars { height: 160px; display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px;
            align-items: end; border-bottom: 1px solid var(--grid);
            background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 50%; }
    .bar-slot { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; cursor: default; }
    .bar { background: var(--series-1); border-radius: 4px 4px 0 0; min-height: 0; }
    .bar-slot:hover .bar { filter: brightness(1.15); }
    .bar-slot:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--card); font-size: 12px; padding: 4px 8px; border-radius: 4px;
            white-space: nowrap; z-index: 2; pointer-events: none; }
    .bar-label { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text); font-weight: 600; }
    .bar-axis { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; font-size: 11px; color: var(--muted); margin-top: 4px; }
    .chart-table { margin-top: 10px; font-size: 13px; }
    .chart-table table { max-width: 280px; }
    .chart-table th, .chart-table td { padding: 4px 8px; }

    .recs { margin: 0 0 12px; padding-left: 20px; }
    .recs li { margin-bottom: 6px; }
    .highlights { border-top: 1px solid var(--line); padding-top: 12px; }
    .cache { font-weight: 600; white-space: nowrap; cursor: help; border-bottom: 1px dotted var(--muted); }
    .cache-no { color: var(--muted); font-weight: 400; }
    td.actions { white-space: normal; min-width: 160px; }
    .action { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin: 1px 2px 1px 0; white-space: nowrap; cursor: help; }

    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tabs a { padding: 6px 12px; border-radius: 6px; color: var(--muted);
              border: 1px solid var(--line); background: var(--card); }
    .tabs a.active { color: var(--text); font-weight: 600; border-color: var(--text); }
    .tabs a:hover { text-decoration: none; }

    .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    td.wrap { white-space: normal; min-width: 220px; }
    td.fix { min-width: 280px; color: var(--muted); }
    .note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }

    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.alert { color: var(--alert); background: var(--alert-bg); }
    .badge.warning { color: var(--warn); background: var(--warn-bg); }
    .empty { padding: 32px; text-align: center; color: var(--muted); }

    /* ---------------------------------------------------------------- Alerts view */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .live[hidden] { display: none; }
    .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 2s infinite; }
    .live.paused .dot { background: var(--muted); animation: none; }
    .live.offline .dot { background: var(--critical); animation: none; }
    .live button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
                   border-radius: 6px; padding: 2px 10px; cursor: pointer; }
    .live button:hover { border-color: var(--muted); }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12,163,12,.5); } 70% { box-shadow: 0 0 0 6px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }

    .search { margin-bottom: 10px; display: flex; gap: 8px; }
    .search input { flex: 1; min-width: 0; font: inherit; font-size: 15px; color: var(--text); background: var(--card);
                    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .search input:focus, .select select:focus { outline: 2px solid var(--link); outline-offset: -1px; border-color: transparent; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .select select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
                     border-radius: 8px; padding: 7px 10px; max-width: 100%; cursor: pointer; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
    .seg label { cursor: pointer; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg span { display: block; padding: 7px 12px; color: var(--muted); border-left: 1px solid var(--line); }
    .seg label:first-child span { border-left: 0; }
    .seg b { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 2px; }
    .seg input:checked + span { background: var(--text); color: var(--card); }
    .seg input:focus-visible + span { outline: 2px solid var(--link); outline-offset: -2px; }
    .seg-alert b { color: var(--alert); } .seg-warning b { color: var(--warn); }
    .seg input:checked + span b { color: inherit; }
    .summary { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .sev1-text { color: var(--alert); font-weight: 600; }

    #live-region { transition: opacity .15s; }
    #live-region.loading { opacity: .55; }

    a.stopper { display: block; color: inherit; }
    a.stopper:hover { text-decoration: none; border-color: var(--alert); }
    .stopper > span { display: block; }

    h3.group { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
    h3.group.sev1 { color: var(--alert); }
    .list { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .item + .item { border-top: 1px solid var(--line); }
    .item summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; }
    .item summary::-webkit-details-marker { display: none; }
    .item summary:hover { background: var(--bg); }
    .item summary:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
    .item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .item-title { font-weight: 600; overflow-wrap: anywhere; }
    .item-meta { color: var(--muted); font-size: 12px; }
    .item .badge { min-width: 46px; text-align: center; }
    .repeat { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
    .repeat.bumped { animation: bump 1.2s ease-out; }
    @keyframes bump { 0% { color: var(--card); background: var(--link); border-color: var(--link); transform: scale(1.15); } 100% { transform: scale(1); } }
    .chevron { color: var(--muted); font-size: 18px; transition: transform .15s; }
    .item[open] .chevron { transform: rotate(90deg); }
    .item[open] summary { background: var(--bg); }
    .item-body { padding: 12px 14px 14px 72px; border-top: 1px dashed var(--line); }
    .open-link { display: inline-block; margin-top: 10px; font-weight: 500; }
    .item.new { animation: arrive 3s ease-out; }
    .item.new .item-title::after { content: "new"; margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--card);
                                   background: var(--link); border-radius: 999px; padding: 0 6px; vertical-align: 2px; }
    @keyframes arrive { from { background: color-mix(in srgb, var(--link) 22%, transparent); } to { background: transparent; } }
    @media (max-width: 600px) { .item-body { padding-left: 14px; } .filter-row .select, .filter-row select { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { .live .dot, .item.new, .repeat.bumped { animation: none; } }

    button.copy { font: inherit; font-size: 12px; color: var(--text); background: var(--card); border: 1px solid var(--line);
                  border-radius: 6px; padding: 1px 8px; margin-left: 4px; cursor: pointer; vertical-align: 1px; }
    button.copy:hover { border-color: var(--muted); }
    button.copy.done { color: var(--good); border-color: var(--good); }
    .code-loc { margin-bottom: 8px; }
    .loc-line { font-weight: 600; margin-left: 6px; }

    dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
    dl.facts dt { color: var(--muted); }
    dl.facts dd { margin: 0; overflow-wrap: anywhere; }
    .where { font-size: 16px; }
  </style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
<script>
  // "Copy" buttons: copy data-copy (e.g. "src/orders/service.py:52") to the clipboard.
  document.addEventListener("click", function (e) {
    var button = e.target.closest && e.target.closest("button[data-copy]");
    if (!button) return;
    e.preventDefault();
    var text = button.dataset.copy;
    function done() { button.textContent = "Copied"; button.classList.add("done");
      setTimeout(function () { button.textContent = "Copy"; button.classList.remove("done"); }, 1500); }
    function fallback() {  // older browsers, plain http, or clipboard permission refused
      var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t);
      t.select(); document.execCommand("copy"); t.remove(); done();
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  });
</script>
</body>
</html>
